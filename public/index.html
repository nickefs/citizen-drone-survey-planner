<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Survey Planner (Esri Satellite)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

  <style>
    html, body { height:100%; margin:0; }
    .leaflet-top.leaflet-left { margin-top: 60px; }

    /* ---------- SMALLER TOPBAR ---------- */
    #topbar {
      position: fixed;
      z-index: 1000;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.95);
      padding: 4px 8px;          /* μικρότερο */
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
      font-family: system-ui, sans-serif;
      display:flex;
      gap:6px;
      align-items:center;
      transform: scale(0.90);    /* μικραίνει όλη τη μπάρα */
      transform-origin: top left;
    }

    #map { height: 100%; }

    button {
      padding:6px 10px;
      border-radius:6px;
      border:1px solid #ccc;
      background:#f6f6f6;
      cursor:pointer;
    }

    button:hover { background:#eee; }
    button.active { background:#ffe08a; border-color:#d6b35f; }

    input[type="number"] {
      width: 74px;
      padding:4px 6px;
    }

    .pill { font-size:12px; color:#555; }
    .divider { width:1px; height:24px; background:#ddd; margin:0 2px; }

    #settingsPanel {
      position: fixed;
      z-index: 1300;
      top: 58px;
      left: 10px;
      width: min(360px, calc(100vw - 20px));
      background: rgba(255,255,255,0.98);
      border: 1px solid #d8d8d8;
      border-radius: 6px;
      box-shadow: 0 8px 28px rgba(0,0,0,.22);
      font-family: system-ui, sans-serif;
      padding: 12px;
      display: none;
    }

    #settingsPanel.open { display: block; }

    .settingsHeader {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 10px;
    }

    .settingsTitle {
      font-size: 14px;
      font-weight: 700;
    }

    .settingsGrid {
      display:grid;
      grid-template-columns: 1fr 88px 88px;
      gap: 8px;
      align-items:center;
    }

    .settingsGrid label {
      font-size: 12px;
      color:#444;
    }

    .settingsGrid .wide {
      grid-column: span 2;
      width: auto;
    }

    .settingsHint {
      margin-top: 10px;
      font-size: 12px;
      color:#666;
    }

    .gsdReadout {
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background:#f7f7f7;
      font-size: 12px;
      color:#333;
      display:flex;
      justify-content:space-between;
      gap: 8px;
    }

    .gsdValue {
      font-weight: 700;
      white-space: nowrap;
    }

    /* ---------- ROUND FLOATING BUTTON ---------- */
    #floatingSurveyBtn {
      position: fixed;
      top: 280px;   /* φαίνεται κάτω από το delete tool */
      left: 7px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: #0084ff;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      z-index: 1200;
    }

    #floatingSurveyBtn:hover {
      background: #006fe0;
    }
  </style>
</head>

<body>

  <!-- Topbar (smaller now) -->
  <div id="topbar">
    <span class="pill">Default Alt (m):</span>
    <input id="altInput" type="number" value="10" step="1" min="1" max="20" />

    <span class="divider"></span>
    <button id="settingsBtn" title="Camera, overlap and turnaround settings">Parameters</button>
    <button id="setHomeBtn" title="Click then click on map">Set Home</button>
    <button id="clearHomeBtn" title="Remove Home marker">Clear Home</button>

    <button id="exportCsvBtn">Export CSV</button>

    <!-- Generate Survey REMOVED from here -->
  </div>

  <div id="settingsPanel" role="dialog" aria-modal="false" aria-labelledby="settingsTitle">
    <div class="settingsHeader">
      <div id="settingsTitle" class="settingsTitle">Survey Parameters</div>
      <button id="closeSettingsBtn" title="Close parameters">Close</button>
    </div>

    <div class="settingsGrid">
      <label for="sensorWidthInput">Sensor W/H (mm)</label>
      <input id="sensorWidthInput" type="number" value="3.68" step="0.01" min="0.01" />
      <input id="sensorHeightInput" type="number" value="2.76" step="0.01" min="0.01" />

      <label for="focalLengthInput">Focal length (mm)</label>
      <input id="focalLengthInput" class="wide" type="number" value="3.04" step="0.01" min="0.01" />

      <label for="imageWidthInput">Image W/H (px)</label>
      <input id="imageWidthInput" type="number" value="3280" step="1" min="1" />
      <input id="imageHeightInput" type="number" value="2474" step="1" min="1" />

      <label for="frontOverlapInput">Overlap F/S (%)</label>
      <input id="frontOverlapInput" type="number" value="25" step="1" min="0" max="95" />
      <input id="sideOverlapInput" type="number" value="25" step="1" min="0" max="95" />

      <label for="turnaroundInput">Turnaround (m)</label>
      <input id="turnaroundInput" class="wide" type="number" value="3" step="0.5" min="0" max="100" />
    </div>

    <div class="gsdReadout">
      <span>GSD</span>
      <span id="gsdValue" class="gsdValue">-- cm/px</span>
    </div>

    <div class="settingsHint">Changes apply the next time you press the blue button.</div>
  </div>

  <!-- ROUND FLOATING BUTTON -->
  <button id="floatingSurveyBtn" onclick="sendPolygonToServer()">▶</button>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

  <script>
    const DEFAULT_ALT = 10;
    const DEFAULT_CAMERA = {
      front_overlap_pct: 25,
      side_overlap_pct: 25,
      sensor_width_mm: 3.68,
      sensor_height_mm: 2.76,
      focal_length_mm: 3.04,
      image_width_px: 3280,
      image_height_px: 2474
    };
    const DEFAULT_TURNAROUND = 3;
    let lastWaypoints = [];
    let homeLatLng = null;
    let homeMarker = null;
    let pickHomeMode = false;
    function clampNumberInput(input, min, max) {
      const v = Number(input.value);
      if (!Number.isFinite(v)) return;
      if (v < min) input.value = String(min);
      else if (v > max) input.value = String(max);
    }
    function bindClamp(id, min, max) {
      const el = document.getElementById(id);
      const clamp = () => clampNumberInput(el, min, max);
      el.addEventListener('input', clamp);
      el.addEventListener('blur', clamp);
    }
    function readPositiveNumber(id, fallback) {
      const v = Number(document.getElementById(id).value);
      return Number.isFinite(v) && v > 0 ? v : fallback;
    }
    function readRangeNumber(id, fallback, min, max) {
      const v = Number(document.getElementById(id).value);
      return Number.isFinite(v) && v >= min && v <= max ? v : fallback;
    }

    function computeGsdCmPerPixel() {
      const altitude = readRangeNumber('altInput', DEFAULT_ALT, 1, 20);
      const sensorWidth = readPositiveNumber('sensorWidthInput', DEFAULT_CAMERA.sensor_width_mm);
      const sensorHeight = readPositiveNumber('sensorHeightInput', DEFAULT_CAMERA.sensor_height_mm);
      const focalLength = readPositiveNumber('focalLengthInput', DEFAULT_CAMERA.focal_length_mm);
      const imageWidth = readPositiveNumber('imageWidthInput', DEFAULT_CAMERA.image_width_px);
      const imageHeight = readPositiveNumber('imageHeightInput', DEFAULT_CAMERA.image_height_px);
      const gsdWidthCm = ((altitude * sensorWidth / focalLength) / imageWidth) * 100;
      const gsdHeightCm = ((altitude * sensorHeight / focalLength) / imageHeight) * 100;
      return (gsdWidthCm + gsdHeightCm) / 2;
    }

    function updateGsdReadout() {
      const gsdValue = document.getElementById('gsdValue');
      const gsd = computeGsdCmPerPixel();
      gsdValue.textContent = Number.isFinite(gsd) ? `${gsd.toFixed(2)} cm/px` : '-- cm/px';
    }

    function bindGsdUpdates(id) {
      const el = document.getElementById(id);
      el.addEventListener('input', updateGsdReadout);
      el.addEventListener('blur', updateGsdReadout);
    }

    bindClamp('altInput', 1, 20);
    bindClamp('frontOverlapInput', 0, 95);
    bindClamp('sideOverlapInput', 0, 95);
    bindClamp('turnaroundInput', 0, 100);
    [
      'altInput',
      'sensorWidthInput',
      'sensorHeightInput',
      'focalLengthInput',
      'imageWidthInput',
      'imageHeightInput'
    ].forEach(bindGsdUpdates);
    updateGsdReadout();

    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const closeSettingsBtn = document.getElementById('closeSettingsBtn');

    function setSettingsOpen(open) {
      settingsPanel.classList.toggle('open', open);
      settingsBtn.classList.toggle('active', open);
      settingsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    settingsBtn.setAttribute('aria-haspopup', 'dialog');
    settingsBtn.setAttribute('aria-expanded', 'false');
    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setSettingsOpen(!settingsPanel.classList.contains('open'));
    });
    closeSettingsBtn.addEventListener('click', () => setSettingsOpen(false));
    settingsPanel.addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', () => setSettingsOpen(false));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setSettingsOpen(false);
    });

    // Map
    const map = L.map('map', { maxZoom: 22 }).setView([39.101418, 26.440039], 17);

    // Basemap (Satellite only)
    const esriSat = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        minZoom: 3,
        maxNativeZoom: 18,
        maxZoom: 22,
        attribution: 'Imagery © <a href="https://www.esri.com/">Esri</a>'
      }
    ).addTo(map);

    function setHome(latlng) {
      homeLatLng = latlng;
      if (homeMarker) map.removeLayer(homeMarker);
      homeMarker = L.marker(latlng, { draggable: true }).addTo(map);
      homeMarker.bindPopup("Home").openPopup();
      homeMarker.on("dragend", () => {
        homeLatLng = homeMarker.getLatLng();
      });
    }

    const setHomeBtn = document.getElementById("setHomeBtn");
    const clearHomeBtn = document.getElementById("clearHomeBtn");

    setHomeBtn.addEventListener("click", () => {
      pickHomeMode = !pickHomeMode;
      setHomeBtn.classList.toggle("active", pickHomeMode);
      setHomeBtn.textContent = pickHomeMode ? "Click map…" : "Set Home";
    });

    clearHomeBtn.addEventListener("click", () => {
      pickHomeMode = false;
      setHomeBtn.classList.remove("active");
      setHomeBtn.textContent = "Set Home";
      homeLatLng = null;
      if (homeMarker) {
        map.removeLayer(homeMarker);
        homeMarker = null;
      }
    });

    map.on("click", (e) => {
      if (!pickHomeMode) return;
      setHome(e.latlng);
      pickHomeMode = false;
      setHomeBtn.classList.remove("active");
      setHomeBtn.textContent = "Set Home";
    });

    // Draw layers
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const surveyLayer = new L.FeatureGroup();
    map.addLayer(surveyLayer);

    const drawControl = new L.Control.Draw({
      position: 'topleft',
      draw: { rectangle:false, circle:false, circlemarker:false, polyline:false, marker:false },
      edit: { featureGroup: drawnItems, remove: true }
    });
    map.addControl(drawControl);

    // Events
    map.on(L.Draw.Event.CREATED, e => {
      const layer = e.layer;
      layer.feature = layer.feature || { type:'Feature', properties:{} };
      layer.feature.properties.type = guessType(layer);
      layer.feature.properties.alt_m = DEFAULT_ALT;
      drawnItems.addLayer(layer);
      surveyLayer.clearLayers();
    });

    map.on(L.Draw.Event.EDITED, e => {
      e.layers.eachLayer(layer => {
        layer.feature = layer.feature || { type:'Feature', properties:{} };
        if (!layer.feature.properties.type)
          layer.feature.properties.type = guessType(layer);
        if (typeof layer.feature.properties.alt_m !== 'number')
          layer.feature.properties.alt_m = DEFAULT_ALT;
      });
      surveyLayer.clearLayers();
    });

    map.on(L.Draw.Event.DELETED, () => {
      surveyLayer.clearLayers();
    });

    function guessType(layer) {
      if (layer instanceof L.Marker) return 'Point';
      if (layer instanceof L.Polyline && !(layer instanceof L.Polygon)) return 'LineString';
      if (layer instanceof L.Polygon) return 'Polygon';
      return 'Unknown';
    }

    // Export helpers
    function download(filename, text) {
      const blob = new Blob([text], { type:'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportCSV() {
      if (!lastWaypoints.length) {
        alert("No waypoints received yet. Press the blue ▶ button.");
        return;
      }

      let rows = ['lat,lon,alt_m,type'];

      lastWaypoints.forEach((wp) => {
        const lat = Number(wp.lat);
        const lon = Number(wp.lon);
        const alt = (wp.alt_m != null) ? Number(wp.alt_m) : DEFAULT_ALT;
        const type = (wp.type != null) ? String(wp.type) : '';
        rows.push(`${lat.toFixed(7)},${lon.toFixed(7)},${alt},${type}`);
      });

      download('survey_waypoints.csv', rows.join('\n'));
    }

    document.getElementById('exportCsvBtn').addEventListener('click', exportCSV);

    function getMainPolygonLatLngs() {
      let polygonLayer = null;

      drawnItems.eachLayer(layer => {
        if (layer instanceof L.Polygon && !polygonLayer) polygonLayer = layer;
      });

      if (!polygonLayer) return null;

      const rings = polygonLayer.getLatLngs();
      const outer = Array.isArray(rings) ? rings[0] : rings;
      if (!outer || outer.length < 3) return null;

      return outer.map(p => ({ lat: p.lat, lon: p.lng }));
    }

    async function sendPolygonToServer() {
      const polygon = getMainPolygonLatLngs();
      if (!polygon) {
        alert("Draw a polygon first!");
        return;
      }

      const altitude = Number(document.getElementById('altInput').value);
      const payload = {
        polygon,
        altitude_m: Number.isFinite(altitude) && altitude > 0 && altitude <= 20 ? altitude : DEFAULT_ALT,
        camera: {
          sensor_width_mm: readPositiveNumber('sensorWidthInput', DEFAULT_CAMERA.sensor_width_mm),
          sensor_height_mm: readPositiveNumber('sensorHeightInput', DEFAULT_CAMERA.sensor_height_mm),
          focal_length_mm: readPositiveNumber('focalLengthInput', DEFAULT_CAMERA.focal_length_mm),
          image_width_px: Math.round(readPositiveNumber('imageWidthInput', DEFAULT_CAMERA.image_width_px)),
          image_height_px: Math.round(readPositiveNumber('imageHeightInput', DEFAULT_CAMERA.image_height_px)),
          front_overlap_pct: readRangeNumber('frontOverlapInput', DEFAULT_CAMERA.front_overlap_pct, 0, 95),
          side_overlap_pct: readRangeNumber('sideOverlapInput', DEFAULT_CAMERA.side_overlap_pct, 0, 95)
        },
        turnaround_m: readRangeNumber('turnaroundInput', DEFAULT_TURNAROUND, 0, 100)
      };

      if (homeLatLng) {
        payload.home = { lat: homeLatLng.lat, lon: homeLatLng.lng };
      }

      const res = await fetch("/api/survey", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      lastWaypoints = Array.isArray(data.waypoints) ? data.waypoints : [];

      surveyLayer.clearLayers();

      if (Array.isArray(data.waypoints) && data.waypoints.length > 0) {
        const latlngs = [];

        data.waypoints.forEach((wp) => {
          const latlng = [wp.lat, wp.lon];
          latlngs.push(latlng);

          L.circleMarker(latlng, { radius: 3 }).addTo(surveyLayer);
        });

        L.polyline(latlngs, { dashArray:"4 4" }).addTo(surveyLayer);
        map.fitBounds(L.latLngBounds(latlngs));
      }

      alert("Received " + data.waypoints.length + " waypoints!");
    }
  </script>

</body>
</html>
